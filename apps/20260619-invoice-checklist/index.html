<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>インボイス対応チェックリストメーカー</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202124;
      --muted: #667085;
      --line: #d9e0e8;
      --paper: #fbfcfd;
      --panel: #ffffff;
      --accent: #315f9d;
      --accent-strong: #254d82;
      --soft: #eef4fb;
      --warm: #f7efe0;
      --warn: #8a5319;
      --shadow: 0 18px 50px rgba(32, 33, 36, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(49, 95, 157, 0.08), rgba(210, 164, 64, 0.1)),
        var(--paper);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    textarea,
    select {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.7rem, 3vw, 2.55rem);
      line-height: 1.1;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      max-width: 780px;
      line-height: 1.65;
    }

    .status {
      display: grid;
      gap: 4px;
      min-width: 188px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
    }

    .status span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .status strong {
      font-size: 1.35rem;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 720px;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(238, 244, 251, 0.78);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1rem;
    }

    .panel-body {
      padding: 18px;
      display: grid;
      gap: 14px;
      flex: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    label,
    fieldset {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.35;
      margin: 0;
      padding: 0;
      border: 0;
    }

    legend {
      padding: 0;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
    }

    select {
      min-height: 42px;
      padding: 0 12px;
    }

    textarea {
      min-height: 78px;
      resize: vertical;
      padding: 12px;
      line-height: 1.65;
    }

    select:focus,
    textarea:focus {
      outline: 3px solid rgba(49, 95, 157, 0.16);
      border-color: var(--accent);
    }

    .checks {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .check {
      min-height: 42px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 9px 10px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .check input {
      width: 18px;
      min-height: 18px;
      accent-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--ink);
      background: #fff;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: #b6c4d3;
    }

    .primary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .primary:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    .sample {
      color: var(--accent-strong);
      background: var(--soft);
      border-color: rgba(49, 95, 157, 0.2);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .metric span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .metric strong {
      font-size: 1.2rem;
    }

    .output {
      min-height: 420px;
      white-space: pre-wrap;
      overflow: auto;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.72;
      background: #fff;
    }

    .empty {
      color: var(--muted);
    }

    .notice {
      padding: 12px 14px;
      color: var(--warn);
      background: var(--warm);
      border: 1px solid rgba(138, 83, 25, 0.18);
      border-radius: 8px;
      line-height: 1.55;
      font-size: 0.9rem;
    }

    .links {
      display: grid;
      gap: 8px;
      font-size: 0.92rem;
    }

    .links a {
      color: var(--accent-strong);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .toast {
      min-height: 22px;
      color: var(--accent-strong);
      font-size: 0.9rem;
    }

    @media (max-width: 900px) {
      .app {
        width: min(100% - 20px, 700px);
        padding-top: 18px;
      }

      header,
      .workspace {
        display: grid;
        grid-template-columns: 1fr;
      }

      .panel {
        min-height: auto;
      }

      .grid,
      .checks,
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>インボイス対応チェックリストメーカー</h1>
        <p class="lead">自分の立場や取引状況を選ぶと、まず確認したいインボイス対応項目を整理します。</p>
      </div>
      <div class="status" aria-live="polite">
        <span>チェック項目</span>
        <strong id="itemCount">未生成</strong>
      </div>
    </header>

    <section class="workspace" aria-label="インボイス対応チェックリスト作成ツール">
      <div class="panel">
        <div class="panel-header">
          <h2>状況</h2>
          <button class="sample" type="button" id="sampleBtn" title="サンプル入力を入れる">サンプル</button>
        </div>
        <div class="panel-body">
          <div class="grid">
            <label>
              あなたの立場
              <select id="role">
                <option value="seller">売手として請求書を出す</option>
                <option value="buyer">買手として請求書を受け取る</option>
                <option value="both">売手・買手の両方</option>
                <option value="deciding">登録するか検討中</option>
              </select>
            </label>
            <label>
              登録状況
              <select id="registration">
                <option value="registered">登録済み</option>
                <option value="notRegistered">未登録</option>
                <option value="unknown">分からない</option>
                <option value="considering">検討中</option>
              </select>
            </label>
          </div>

          <div class="grid">
            <label>
              主な取引相手
              <select id="partner">
                <option value="business">事業者が多い</option>
                <option value="consumer">一般消費者が多い</option>
                <option value="mixed">どちらもある</option>
              </select>
            </label>
            <label>
              現在の消費税区分
              <select id="taxStatus">
                <option value="unknown">分からない</option>
                <option value="taxable">課税事業者</option>
                <option value="exempt">免税事業者</option>
              </select>
            </label>
          </div>

          <fieldset>
            <legend>当てはまるもの</legend>
            <div class="checks">
              <label class="check"><input type="checkbox" id="issuesInvoices">請求書・領収書を発行する</label>
              <label class="check"><input type="checkbox" id="receivesInvoices">仕入れや経費の請求書を受け取る</label>
              <label class="check"><input type="checkbox" id="reducedTax">8%対象品目を扱う</label>
              <label class="check"><input type="checkbox" id="retail">小売・飲食など不特定多数向け販売がある</label>
              <label class="check"><input type="checkbox" id="askedByClient">取引先から登録番号を聞かれた</label>
              <label class="check"><input type="checkbox" id="usesAccounting">会計ソフト・請求書ツールを使っている</label>
            </div>
          </fieldset>

          <label>
            メモ
            <textarea id="memo" placeholder="例: 取引先から登録番号の記載を求められた。領収書も発行している。"></textarea>
          </label>

          <div class="actions">
            <button class="primary" type="button" id="generateBtn" title="チェックリストを生成する">生成</button>
            <button type="button" id="clearBtn" title="入力を消す">クリア</button>
          </div>

          <p class="notice">このツールは確認項目の整理用です。登録要否や消費税申告などの判断は、国税庁の公式情報、税務署、税理士等に確認してください。</p>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>チェックリスト</h2>
          <button type="button" id="copyBtn" title="チェックリストをコピーする">コピー</button>
        </div>
        <div class="panel-body">
          <div class="summary">
            <div class="metric"><span>売手</span><strong id="sellerCount">0</strong></div>
            <div class="metric"><span>買手</span><strong id="buyerCount">0</strong></div>
            <div class="metric"><span>登録確認</span><strong id="decisionCount">0</strong></div>
          </div>
          <div class="output empty" id="output">左側に入力して「生成」を押してください。</div>
          <div class="links">
            <a href="https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi/keigenzeiritsu/invoice.htm" target="_blank" rel="noreferrer">国税庁 インボイス制度 特設サイト</a>
            <a href="https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi/keigenzeiritsu/invoice_about.htm" target="_blank" rel="noreferrer">国税庁 インボイス制度について</a>
            <a href="https://www.invoice-kohyo.nta.go.jp/" target="_blank" rel="noreferrer">適格請求書発行事業者 公表サイト</a>
          </div>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const fields = {
      role: document.querySelector("#role"),
      registration: document.querySelector("#registration"),
      partner: document.querySelector("#partner"),
      taxStatus: document.querySelector("#taxStatus"),
      memo: document.querySelector("#memo"),
      issuesInvoices: document.querySelector("#issuesInvoices"),
      receivesInvoices: document.querySelector("#receivesInvoices"),
      reducedTax: document.querySelector("#reducedTax"),
      retail: document.querySelector("#retail"),
      askedByClient: document.querySelector("#askedByClient"),
      usesAccounting: document.querySelector("#usesAccounting")
    };
    const output = document.querySelector("#output");
    const toast = document.querySelector("#toast");
    const itemCount = document.querySelector("#itemCount");
    const sellerCount = document.querySelector("#sellerCount");
    const buyerCount = document.querySelector("#buyerCount");
    const decisionCount = document.querySelector("#decisionCount");
    let lastChecklist = "";

    const sample = {
      role: "both",
      registration: "registered",
      partner: "business",
      taxStatus: "taxable",
      memo: "取引先から登録番号の記載を求められた。領収書も発行している。",
      issuesInvoices: true,
      receivesInvoices: true,
      reducedTax: false,
      retail: false,
      askedByClient: true,
      usesAccounting: true
    };

    function add(list, text) {
      list.push(`- [ ] ${text}`);
    }

    function shouldShowSeller() {
      return ["seller", "both"].includes(fields.role.value) || fields.issuesInvoices.checked;
    }

    function shouldShowBuyer() {
      return ["buyer", "both"].includes(fields.role.value) || fields.receivesInvoices.checked;
    }

    function shouldShowDecision() {
      return fields.role.value === "deciding" || ["notRegistered", "unknown", "considering"].includes(fields.registration.value);
    }

    function buildChecklist() {
      const seller = [];
      const buyer = [];
      const decision = [];
      const common = [];

      if (shouldShowDecision()) {
        add(decision, "自分が課税事業者か免税事業者かを確認する");
        add(decision, "取引先が事業者中心か、一般消費者中心かを整理する");
        add(decision, "取引先から登録番号やインボイス交付を求められているか確認する");
        add(decision, "登録すると消費税の申告が必要になる点を確認する");
        add(decision, "国税庁の登録申請手続ページや税務署・税理士に確認する");
      }

      if (shouldShowSeller()) {
        add(seller, "インボイス発行事業者として登録済みか確認する");
        add(seller, "登録番号を請求書・領収書に記載できる状態にする");
        add(seller, "自社名または氏名、取引年月日、取引内容を記載できるか確認する");
        add(seller, "税率ごとの対価の総額、適用税率、消費税額等を記載できるか確認する");
        add(seller, "交付したインボイスの写しを保存する運用を決める");
        if (fields.reducedTax.checked) add(seller, "軽減税率8%の対象品目である旨を分かるようにする");
        if (fields.retail.checked) add(seller, "簡易インボイスを使える業種・取引か確認する");
        if (fields.usesAccounting.checked) add(seller, "会計ソフトや請求書ツールに登録番号・税率別表示の設定があるか確認する");
      }

      if (shouldShowBuyer()) {
        add(buyer, "仕入れや経費の請求書・領収書を保存する運用を確認する");
        add(buyer, "取引先の登録番号を公表サイトで確認できるようにする");
        add(buyer, "受け取った書類に登録番号、税率、消費税額等があるか確認する");
        add(buyer, "インボイスがない経費について、仕入税額控除への影響を確認する");
        add(buyer, "簡易課税や特例を使う場合の扱いを確認する");
        if (fields.reducedTax.checked) add(buyer, "8%と10%の税率が混在する取引で、税率別の記載を確認する");
      }

      if (fields.askedByClient.checked) {
        add(common, "取引先へ伝える登録番号、事業者名、適用開始日を整理する");
      }
      if (fields.partner.value === "consumer") {
        add(common, "一般消費者向け取引が中心でも、事業者との取引があるか確認する");
      }
      add(common, "最終判断は国税庁の公式情報、税務署、税理士等で確認する");

      const parts = ["# インボイス対応チェックリスト", ""];
      if (decision.length) parts.push("## 登録判断・状況確認", ...decision, "");
      if (seller.length) parts.push("## 売手として確認すること", ...seller, "");
      if (buyer.length) parts.push("## 買手として確認すること", ...buyer, "");
      parts.push("## 共通の確認", ...common, "");
      const memo = fields.memo.value.trim();
      if (memo) parts.push("## メモ", memo, "");
      parts.push("## 公式確認先", "- 国税庁 インボイス制度 特設サイト", "- 適格請求書発行事業者 公表サイト");

      sellerCount.textContent = seller.length;
      buyerCount.textContent = buyer.length;
      decisionCount.textContent = decision.length;
      itemCount.textContent = String(seller.length + buyer.length + decision.length + common.length);
      return parts.join("\n");
    }

    function render() {
      lastChecklist = buildChecklist();
      output.textContent = lastChecklist;
      output.classList.remove("empty");
      toast.textContent = "チェックリストを生成しました。";
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const helper = document.createElement("textarea");
      helper.value = text;
      helper.setAttribute("readonly", "");
      helper.style.position = "fixed";
      helper.style.left = "-9999px";
      document.body.appendChild(helper);
      helper.select();
      document.execCommand("copy");
      document.body.removeChild(helper);
    }

    document.querySelector("#generateBtn").addEventListener("click", render);
    document.querySelector("#sampleBtn").addEventListener("click", () => {
      Object.entries(sample).forEach(([key, value]) => {
        if (fields[key].type === "checkbox") {
          fields[key].checked = value;
        } else {
          fields[key].value = value;
        }
      });
      render();
    });
    document.querySelector("#clearBtn").addEventListener("click", () => {
      fields.role.value = "seller";
      fields.registration.value = "registered";
      fields.partner.value = "business";
      fields.taxStatus.value = "unknown";
      fields.memo.value = "";
      ["issuesInvoices", "receivesInvoices", "reducedTax", "retail", "askedByClient", "usesAccounting"].forEach((key) => {
        fields[key].checked = false;
      });
      lastChecklist = "";
      output.textContent = "左側に入力して「生成」を押してください。";
      output.classList.add("empty");
      itemCount.textContent = "未生成";
      sellerCount.textContent = "0";
      buyerCount.textContent = "0";
      decisionCount.textContent = "0";
      toast.textContent = "";
    });
    document.querySelector("#copyBtn").addEventListener("click", async () => {
      if (!lastChecklist) {
        toast.textContent = "コピーできるチェックリストがまだありません。";
        return;
      }
      try {
        await copyText(lastChecklist);
        toast.textContent = "コピーしました。";
      } catch (error) {
        toast.textContent = "コピーできませんでした。手動で選択してください。";
      }
    });
  </script>
</body>
</html>
