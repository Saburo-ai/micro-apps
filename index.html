<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>c-project2</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #667085;
      --line: #d9e0e8;
      --paper: #fbfcfd;
      --panel: #ffffff;
      --accent: #16736f;
      --soft: #eef7f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(135deg, rgba(22, 115, 111, 0.08), rgba(218, 176, 73, 0.09)), var(--paper);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.08;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .app {
      display: grid;
      gap: 12px;
      padding: 20px;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(32, 33, 36, 0.08);
    }

    .app:hover {
      border-color: rgba(22, 115, 111, 0.48);
    }

    .app span {
      width: fit-content;
      padding: 4px 9px;
      border-radius: 999px;
      color: var(--accent);
      background: var(--soft);
      font-size: 0.78rem;
    }

    .app h2 {
      margin: 0;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>c-project2</h1>
      <p>小さなアプリやサービスを量産して公開し、反応のよかったものを育てる実験プロジェクトです。</p>
    </header>

    <section class="grid" aria-label="公開中のアプリ">
      <a class="app" href="./apps/20260619-weekly-report-helper/">
        <span>公開実験 001</span>
        <h2>Weekly Report Helper</h2>
        <p>箇条書きの作業メモを、週報として読みやすい形に整えます。</p>
      </a>
    </section>
  </main>
</body>
</html>
